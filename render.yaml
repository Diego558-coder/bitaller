# Blueprint de Render: crea la base de datos PostgreSQL y el servicio web de Bitaller
databases:
  - name: bitaller-db
    plan: free
    databaseName: bitaller
    user: bitaller

services:
  - type: web
    name: bitaller
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bitaller-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_MODE
        value: demo
      - key: ALLOW_DEMO
        value: "true"
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_TEMPLATE_LANG
        value: es
      - key: APP_URL
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
