# Blueprint de Render: servicio web de Bitaller (plan gratis).
# La base de datos es PostgreSQL de Supabase (gratis, no vence): pegue su cadena en DATABASE_URL.
services:
  - type: web
    name: bitaller
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: WHATSAPP_MODE
        value: demo
      - key: ALLOW_DEMO
        value: "true"
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_TEMPLATE_LANG
        value: es
      - key: APP_URL
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
